<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIR NOTAM & CFP/FPL Route Comparator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">
    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded">A350 Ops</span>
            <h1 class="text-lg font-semibold tracking-wide">NOTAM Map & CFP/FPL Route Comparator</h1>
        </div>
        <div class="flex items-center space-x-3">
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded shadow transition flex items-center space-x-2">
                <span>📂 OFP PDF 업로드</span>
                <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar / Comparison Panel -->
        <aside class="w-96 bg-slate-800/90 border-r border-slate-700 flex flex-col shrink-0 overflow-y-auto p-4 space-y-4">
            <div class="border-b border-slate-700 pb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-indigo-400">Route Comparison (CFP vs FPL)</h2>
                <p class="text-xs text-slate-400 mt-1">CFP (`2ND-$` 아래) 루트와 FPL 페이지(네 번째 줄 항) 루트를 정밀 대조합니다.</p>
            </div>

            <!-- Comparison Status Card -->
            <div id="comparison-card" class="p-3 rounded-lg border bg-slate-900/50 border-slate-700 text-sm transition-all">
                <div class="flex items-center justify-between mb-2">
                    <span class="font-medium text-slate-300">비교 상태:</span>
                    <span id="match-badge" class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-700 text-slate-300">대기 중</span>
                </div>
                <div class="space-y-2 text-xs">
                    <div>
                        <span class="text-slate-400 block font-semibold mb-0.5">CF Route (2ND-$ 아래):</span>
                        <div id="cfp-route-text" class="p-1.5 bg-slate-950 rounded border border-slate-800 font-mono text-slate-300 break-all min-h-[30px]">-</div>
                    </div>
                    <div>
                        <span class="text-slate-400 block font-semibold mb-0.5">FPL Route (네 번째 줄 항):</span>
                        <div id="fpl-route-text" class="p-1.5 bg-slate-950 rounded border border-slate-800 font-mono text-slate-300 break-all min-h-[30px]">-</div>
                    </div>
                </div>
            </div>

            <!-- NOTAM Summary & List -->
            <div class="flex-1 flex flex-col min-h-[200px]">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">항로 검증 및 NOTAM 매칭</h3>
                <div id="notam-list" class="flex-1 bg-slate-900/80 rounded border border-slate-700 p-2 overflow-y-auto text-xs space-y-2">
                    <p class="text-slate-500 text-center py-8">PDF 파일을 업로드하면 루트 비교 및 노탐 분석이 시작됩니다.</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full z-0"></div>
        </main>
    </div>

    <!-- Script Logic -->
    <script>
        // Initialize Map
        const map = L.map('map').setView([37.5665, 126.9780], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let routeLayer = null;

        // PDF Upload Handler
        document.getElementById('pdf-upload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;

                let pagesText = [];
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent
